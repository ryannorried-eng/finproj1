[project]
name = "line-tracker"
version = "0.1.0"
description = "Track sports betting lines across sportsbooks"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "joblib>=1.3",
    "matplotlib==3.10.8",
    "pandas==2.3.3",
    "pyarrow>=17.0",
    "scikit-learn>=1.4",
    "scipy>=1.10",
    "streamlit==1.54.0",
]

[project.optional-dependencies]
xgboost = [
    "xgboost>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"line_tracker" = ["db/migrations/*.sql"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
